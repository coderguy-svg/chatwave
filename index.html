<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatWave</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="app">
    <section id="authView" class="card">
      <h1>🌊 ChatWave</h1>
      <p class="muted">Real-time chatting, powered by Supabase.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn">Log in</button>
      <button id="signupBtn" class="secondary">Create account</button>
      <p id="authMessage" class="message"></p>
    </section>

    <section id="chatView" class="chat-layout hidden">
      <header class="topbar">
        <div><strong>🌊 ChatWave</strong><span id="userLabel"></span></div>
        <div>
          <button id="themeBtn" class="small">☀️/🌙</button>
          <button id="logoutBtn" class="small">Log out</button>
        </div>
      </header>

      <aside class="sidebar">
        <h3>People</h3>
        <input id="userSearch" placeholder="Search usernames..." />
        <div id="usersList"></div>
      </aside>

      <section class="conversation">
        <div class="conversationHeader">
          <h2 id="conversationTitle">Select a person</h2>
          <span id="status"></span>
        </div>
        <div id="messages" class="messages">
          <p class="muted center">Choose someone to start chatting.</p>
        </div>
        <form id="messageForm" class="composer">
          <input id="messageInput" placeholder="Type a message..." autocomplete="off" disabled />
          <button id="sendBtn" disabled>Send</button>
        </form>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
